[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskbridge"
version = "0.4.0"
description = "Explainable, vendor-neutral cyber-risk decision engine for known-CVE and pre-CVE exposure"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RiskBridge Contributors"}]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "plotly>=5.20",
  "streamlit>=1.40",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "networkx>=3.3",
  "packaging>=24.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
riskbridge = "riskbridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
